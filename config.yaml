data:
  start_date: "20210101"
  end_date: null
  cache_dir: "data"
  local_csv_dir: "data/local_csv"
  tushare_api_url: "http://api.waditu.com/dataapi"
  tushare_timeout: 30
  proxy_url: "http://127.0.0.1:7890"
  amount_unit: "thousand_yuan"
  benchmark_codes:
    - "000300.SH"
    - "000985.CSI"
  market_index_code: "000300.SH"
  use_intraday: false
  use_fundamental: true

backtest:
  initial_cash: 1000000
  commission_rate: 0.0003
  slippage: 0.0
  rebalance_frequency: "biweekly"
  execution_price: "close"
  top_k: 1
  min_final_score: null

strategy:
  version: "0.4-dividend-crowding-margin"
  liquidity_threshold: 30000000
  ma_short: 20
  ma_medium: 60
  ma_long: 120
  market_ma: 120
  max_intraday_premium: 0.05
  intraday_below_ma_bars: 3
  switch_buffer: 0.20
  keep_if_rank_within: 2
  min_trade_value: 1000
  rebalance_tolerance: 0.02
  style_top_k:
    growth: 1
    stable_value: 1
    cyclical_value: 1
  style_allocation:
    strong:
      growth: 0.50
      stable_value: 0.35
      cyclical_value: 0.15
      cash: 0.00
    neutral:
      growth: 0.25
      stable_value: 0.55
      cyclical_value: 0.10
      cash: 0.10
    weak:
      growth: 0.05
      stable_value: 0.70
      cyclical_value: 0.05
      cash: 0.20
    crisis:
      growth: 0.00
      stable_value: 0.45
      cyclical_value: 0.00
      cash: 0.55
  allocation_adjustment:
    structure_neutral_growth_add: 0.10
    structure_weak_growth_add: 0.05
    structure_weak_cyclical_add: 0.05
    margin_growth_cut: 0.10
    margin_cyclical_cut: 0.05
    max_growth: 0.60
    max_cyclical_value: 0.20
    min_stable_value: 0.25
  growth_factors:
    ret_60: 0.25
    ret_120: 0.15
    ret_20: 0.10
    relative_ret_60: 0.15
    trend_structure: 0.15
    vol_20: -0.10
    premium_20: -0.10
    amount_crowding: -0.05
    valuation_percentile: -0.05
  stable_value_factors:
    dividend_yield_abs: 0.15
    dividend_yield_percentile: 0.15
    dividend_spread: 0.20
    dividend_spread_percentile: 0.15
    valuation_score: 0.15
    ret_60: 0.05
    vol_20: -0.10
    drawdown_risk_60: -0.05
  cyclical_value_factors:
    ret_60: 0.20
    ret_120: 0.15
    relative_ret_60: 0.20
    valuation_score: 0.15
    dividend_yield_abs: 0.05
    vol_20: -0.10
    drawdown_risk_60: -0.10
    amount_crowding: -0.05

